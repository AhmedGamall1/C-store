<svg viewBox="0 0 980 692" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>C-Store system architecture (dark)</title>
  <desc>Users reach C-Store via Cloudflare, then a Caddy reverse proxy on a single Linux VPS running Docker Compose with a React web app (storefront + admin), an Express API, PostgreSQL and Redis. The API runs an in-process stock-expiry job. A host cron backs up Postgres to Backblaze B2. The API integrates Paymob, Cloudinary and Gmail. CI/CD deploys via GitHub Actions and GHCR.</desc>
